name: Release

# Pushing tag vX.Y.Z publishes, from the same commit:
#   image  ghcr.io/asappinc-opensource/wsmon:X.Y.Z            (linux/amd64, linux/arm64)
#   chart  oci://ghcr.io/asappinc-opensource/wsmon-helm/wsmon  version X.Y.Z
# Both are signed with cosign (keyless, GitHub OIDC). The image also carries
# buildx SBOM and provenance attestations.
#
# Two jobs, so nothing untrusted runs where credentials are:
#   verify   read-only: tag format, tag is on main, versions agree, tests
#   publish  the `release` environment (required reviewers): build, push, sign
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# One release at a time; never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history, for the ancestry check below

      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vX.Y.Z"
            exit 1
          fi
          # Only release commits that are already on main (reviewed, CI-green).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi
          # Tag, Makefile VERSION, Chart version and appVersion must all agree.
          make check-version

      - name: Test
        # Runs unpinned build containers, so it stays out of the publish job.
        run: make lint test helm-test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Required reviewers are configured on this environment in repo settings.
    environment: release
    permissions:
      contents: read
      packages: write   # push image and chart to GHCR
      id-token: write   # cosign keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/wsmon-helm
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      # The builder that compiles the published image, and buildx's SBOM
      # generator: both pinned rather than floating buildx defaults.
      BUILDKIT_IMAGE: moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      SBOM_GENERATOR: docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
    defaults:
      run:
        # Explicit bash gets -o pipefail; GitHub's implicit default does not.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          make image PUSH=1 IMAGE="$IMAGE" BUILDKIT_IMAGE="$BUILDKIT_IMAGE" IMAGE_BUILD_FLAGS="\
            --metadata-file $RUNNER_TEMP/image-metadata.json \
            --sbom=generator=$SBOM_GENERATOR --provenance=mode=max \
            --label org.opencontainers.image.source=$SOURCE_URL \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --annotation index:org.opencontainers.image.source=$SOURCE_URL \
            --annotation index:org.opencontainers.image.revision=$GITHUB_SHA"

      - name: Sign image
        run: |
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")
          echo "image: $IMAGE@$digest"
          cosign sign --yes "$IMAGE@$digest"

      - name: Push chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # helm may print Pushed:/Digest: on stderr; capture both streams.
          make helm-push CHART_REPO="$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"

      - name: Sign chart
        run: |
          digest=$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/helm-push.log" | head -1)
          test -n "$digest" || { echo "no digest in helm push output"; exit 1; }
          chart="${CHART_REPO#oci://}/wsmon@$digest"
          echo "chart: $chart"
          cosign sign --yes "$chart"
