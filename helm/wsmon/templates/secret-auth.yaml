{{- /* One auth Secret shared by both roles; only for an inline token. */}}
{{- if include "wsmon.authInline" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wsmon.authSecretName" . }}
  labels:
    {{- include "wsmon.sharedLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secret.key }}: {{ .Values.auth.token | b64enc | quote }}
{{- end }}
