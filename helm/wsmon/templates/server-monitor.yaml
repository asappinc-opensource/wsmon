{{- if .Values.server.enabled }}
{{- $ctx := dict "root" . "component" "server" }}
{{- $mon := include "wsmon.monitoring" $ctx | fromJson }}
{{- if ne $mon.type "none" }}
{{- $podMonitor := eq $mon.type "podMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: {{ ternary "PodMonitor" "ServiceMonitor" $podMonitor }}
metadata:
  name: {{ include "wsmon.server.fullname" . }}
  {{- with $mon.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "wsmon.labels" $ctx | nindent 4 }}
    {{- with $mon.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $mon.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $mon.namespace }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wsmon.selectorLabels" $ctx | nindent 6 }}
  {{ ternary "podMetricsEndpoints" "endpoints" $podMonitor }}:
    {{- include "wsmon.monitorEndpoint" (dict "mon" $mon "port" "metrics" "path" (include "wsmon.server.metricsPath" .)) | nindent 4 }}
{{- end }}
{{- end }}
