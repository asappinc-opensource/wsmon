{{- /* One ServiceAccount per enabled role. Neither role talks to the API server. */}}
{{- range $component := list "server" "client" }}
{{- $role := index $.Values $component }}
{{- if and $role.enabled $role.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wsmon.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "wsmon.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $role.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
